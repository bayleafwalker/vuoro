[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vuoro-bootstrap"
version = "0.1.0"
description = "Release-gated Vuoro Cloud bootstrap client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "vuoro-client==0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
vuoro = "vuoro_bootstrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vuoro_bootstrap"]

[tool.uv.sources]
vuoro-client = { workspace = true }
