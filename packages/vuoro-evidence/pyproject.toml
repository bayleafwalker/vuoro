[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vuoro-evidence"
version = "0.1.0"
description = "EvidenceSet consumer: host-agnostic claim reducer and decision path with registered ingress edges"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/vuoro_evidence"]
