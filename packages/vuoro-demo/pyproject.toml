[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vuoro-demo"
version = "0.1.0"
description = "Optional disposable native-client settlement conformance demonstration"
requires-python = ">=3.12"
dependencies = [
  "vuoro-client @ https://github.com/bayleafwalker/vuoro/releases/download/vuoro-client-v0.1.2/vuoro_client-0.1.2-py3-none-any.whl#sha256=7a4f32d4e2531a1abc99f5dc017fb8f6f22c4a1ef191079b98808be897081660",
  "vuoro-service @ https://github.com/bayleafwalker/vuoro/releases/download/vuoro-service-v0.1.92/vuoro_service-0.1.92-py3-none-any.whl#sha256=e700596f5e3cf3eda4cec34ec4c4149ca0a9adf1f364404214f53d10b7c154ec",
  "sprintctl[remote] @ https://github.com/bayleafwalker/sprintctl/releases/download/v0.18.0/sprintctl-0.18.0-py3-none-any.whl#sha256=3fcbdaa5b56d18fe8a5b744195b143f2bd57fe221123ba1d567a8c4b198e2850",
]

[project.scripts]
vuoro = "vuoro_demo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vuoro_demo"]

[tool.hatch.metadata]
allow-direct-references = true
