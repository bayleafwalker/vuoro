[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vuoro-knowledge"
version = "0.1.0"
description = "Documentation resolution and provenance over Git-authored knowledge: validated metadata, a rebuildable catalog, and work-context source manifests (docs/architecture/knowledge-resolution.md)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6,<7"]

[project.scripts]
vuoro-knowledge = "vuoro_knowledge.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/vuoro_knowledge"]
