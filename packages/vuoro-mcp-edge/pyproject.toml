[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vuoro-mcp-edge"
version = "0.1.6"
description = "Vuoro MCP protocol server: read tools over gateway identity assertions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "vuoro-service",
  "vuoro-evidence",
  "httpx>=0.27,<1",
  "operator-projection @ https://github.com/bayleafwalker/agentops/releases/download/operator-projection-v0.2.5/operator_projection-0.2.5-py3-none-any.whl#sha256=6ebd68e0ac9bd13efc19273375b4b10b024832ae85903fc36a2c26a3afbe7b84",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/vuoro_mcp_edge"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
vuoro-service = { workspace = true }
vuoro-evidence = { workspace = true }
