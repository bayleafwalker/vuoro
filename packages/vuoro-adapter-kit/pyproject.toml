[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vuoro-adapter-kit"
version = "0.1.0"
description = "Dependency-free JSON-Schema and catalog registration primitives for Vuoro adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/vuoro_adapter_kit"]
