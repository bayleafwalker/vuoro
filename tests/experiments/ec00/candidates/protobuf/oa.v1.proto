syntax = "proto3";

package ec00.oa.v1;

option go_package = "example.com/vuoro-ec00/ec00/generated/protobuf/go/oa/v1;v1";

import "google/protobuf/struct.proto";

message PublishRequest {
  // OA item identifiers are decimal strings so JavaScript clients do not round
  // values above Number.MAX_SAFE_INTEGER.
  string request_id = 1;
  optional string objective = 2;
  oneof note_value {
    string note = 3;
    google.protobuf.NullValue note_null = 4;
  }
  repeated string dependent_ids = 5;
  string artifact_digest = 6;
  string artifact_key_id = 7;
  bytes artifact_bytes = 8;
  bytes artifact_envelope = 9;
  bytes artifact_signature = 10;
}

message ReviseRequest {
  string request_id = 1;
  optional int64 expected_revision = 2;
  optional string objective = 3;
  oneof note_value {
    string note = 4;
    google.protobuf.NullValue note_null = 5;
  }
}

message MutationResult {
  string request_id = 1;
  int64 revision = 2;
}

message WithdrawDependentRequest { string request_id = 1; string dependent_id = 2; optional int64 expected_revision = 3; }
message ReportPerformedRequest { string request_id = 1; optional int64 expected_revision = 2; }
message VerifyRequest { string request_id = 1; optional int64 expected_revision = 2; string evidence_ref = 3; }
message DecideArtifactRequest { string request_id = 1; optional int64 expected_revision = 2; string artifact_digest = 3; }
message ResolveRequest { string request_id = 1; optional int64 expected_revision = 2; }
message AcknowledgeContinuationRequest { string request_id = 1; string dependent_id = 2; optional int64 expected_revision = 3; }
message RequestById { string request_id = 1; }
message ReadArtifactRequest { string request_id = 1; int64 material_revision = 2; }
message PageRequest { optional string cursor = 1; int32 limit = 2; }
message JsonResult { string json = 1; }

service OwnerOperations {
  rpc Publish(PublishRequest) returns (MutationResult);
  rpc Revise(ReviseRequest) returns (MutationResult);
  rpc WithdrawDependent(WithdrawDependentRequest) returns (MutationResult);
  rpc ReportPerformed(ReportPerformedRequest) returns (MutationResult);
  rpc Verify(VerifyRequest) returns (MutationResult);
  rpc DecideArtifact(DecideArtifactRequest) returns (MutationResult);
  rpc Resolve(ResolveRequest) returns (MutationResult);
  rpc AcknowledgeContinuation(AcknowledgeContinuationRequest) returns (MutationResult);
  rpc ReadRequest(RequestById) returns (JsonResult);
  rpc ReadDependants(RequestById) returns (JsonResult);
  rpc ReadArtifact(ReadArtifactRequest) returns (JsonResult);
  rpc ListRequests(PageRequest) returns (JsonResult);
  rpc Watch(PageRequest) returns (JsonResult);
}
