[package]
name = "ec00-rust-client-check"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
ec00_oa_v2 = { path = "../../generated/typespec-v2/clients/rust", default-features = false, features = ["rustls"] }
base64 = "=0.22.1"
ec00_oa = { path = "../../generated/typespec/clients/rust", default-features = false, features = ["rustls"] }
prost = "=0.14.3"
prost-types = "=0.14.3"
reqwest = { version = "=0.13.0", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "time"] }
tonic = { version = "=0.14.6", features = ["transport"] }
tonic-prost = "=0.14.6"

[build-dependencies]
tonic-prost-build = "=0.14.6"
