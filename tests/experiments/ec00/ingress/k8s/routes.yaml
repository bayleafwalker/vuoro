# All three attach to the existing Cilium Gateway gateway/internal (192.168.20.219),
# listener "https" (443, TLS terminated with the *.apps.kotona.app wildcard,
# routes allowed from all namespaces, HTTPRoute and GRPCRoute both supported).
# gRPC gets its own hostname: Gateway API requires an implementation to accept
# only one of an HTTPRoute and a GRPCRoute whose hostnames intersect on the same
# listener, so sharing a hostname would silently drop one of them.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ec00-qualification-http
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: internal, namespace: gateway, sectionName: https}
  hostnames: [ec00-qualification.apps.kotona.app]
  rules:
    - backendRefs:
        - {name: ec00-ingress-fixture, port: 8080}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ec00-qualification-connect
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: internal, namespace: gateway, sectionName: https}
  hostnames: [ec00-qualification-connect.apps.kotona.app]
  rules:
    - backendRefs:
        - {name: ec00-ingress-fixture, port: 8081}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: ec00-qualification-grpc
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: internal, namespace: gateway, sectionName: https}
  hostnames: [ec00-qualification-grpc.apps.kotona.app]
  rules:
    - backendRefs:
        - {name: ec00-ingress-fixture, port: 8082}
