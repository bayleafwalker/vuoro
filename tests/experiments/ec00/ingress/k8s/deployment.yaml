apiVersion: apps/v1
kind: Deployment
metadata:
  name: ec00-ingress-fixture
  labels:
    app.kubernetes.io/name: ec00-ingress-fixture
spec:
  replicas: 1
  # One SQLite owner store per pod: never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ec00-ingress-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ec00-ingress-fixture
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: ec00-ingress-fixture
          imagePullPolicy: IfNotPresent
          env:
            - {name: EC00_PUBLIC_KEY_FILE, value: /fixture/public.pem}
            - {name: EC00_STATE_DIR, value: /state}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
            - {name: connect, containerPort: 8081, protocol: TCP}
            - {name: grpc, containerPort: 8082, protocol: TCP}
          readinessProbe:
            httpGet: {path: /_ec00/healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi, ephemeral-storage: 16Mi}
            limits: {cpu: 500m, memory: 256Mi, ephemeral-storage: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: public-key, mountPath: /fixture, readOnly: true}
      volumes:
        # Disposable owner store: lost with the pod by design.
        - name: state
          emptyDir: {sizeLimit: 64Mi}
        - name: public-key
          configMap:
            name: ec00-fixture-public-key
            items:
              - {key: public.pem, path: public.pem}
