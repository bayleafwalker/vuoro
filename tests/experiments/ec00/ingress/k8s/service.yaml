apiVersion: v1
kind: Service
metadata:
  name: ec00-ingress-fixture
  labels:
    app.kubernetes.io/name: ec00-ingress-fixture
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ec00-ingress-fixture
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
    # uvicorn serves HTTP/1.1 only; no h2c hint for the Connect port.
    - {name: connect, port: 8081, targetPort: connect, protocol: TCP}
    # Tells the Cilium Gateway (enable-gateway-api-app-protocol) to use h2c upstream.
    - {name: grpc, port: 8082, targetPort: grpc, protocol: TCP, appProtocol: kubernetes.io/h2c}
