version: 2
purpose: Vuoro keeps heterogeneous agent work resumable across sessions, hosts, repositories and runtimes, and makes
  the accepted result reconstructible.
supersedes: docs/plans/2026-08-22-long-term-direction.md
revision_note: 'v2 (2026-09-01) closes six review gaps, each re-verified at the artifact. Added rows for appservice
  and gitops-nixos - the two infrastructure repos every artifact check lands in, previously unenumerated - and for
  the takeover-20260820 experiment. Added verdict_vocabulary and path_conventions. Rewrote all nine overloaded `contradicted`
  verdicts so `verdict` judges the adjacent claim while `contradicts_record` carries disagreement with the decision
  record. Demoted bindery-core promote -> hold on its own evidence. Made every source path absolute. Two v1 findings
  were themselves corrected: the meta-layer identifier-absence claim is false, and the takeover package was executed
  to an adjudicated verdict rather than left unrun. Prose is compressed relative to v1; all verified facts and citations
  are retained.'
path_conventions:
  absolute_paths_only: Every `source` value is an absolute path or a command, with `~/` abbreviating `/projects/dev/`.
    A path that is relative to anything else is a defect - v1 carried one on its most consequential citation.
  two_artifacts_roots: /projects/dev/_artifacts and /projects/dev/agentops/_artifacts are DISTINCT stores and both
    contain an `agentops/` subtree. Acceptance reports live only under /projects/dev/agentops/_artifacts/agentops/acceptance/;
    /projects/dev/_artifacts/agentops/ holds audit, audit-retired-2026-08-26, capability, hybrid-dispatch, model and
    preflight, and has no acceptance directory. Resolving an acceptance citation against the wrong root returns nothing
    and reads as absent evidence.
status_vocabulary:
  active: Running, maintained, carrying live load; evidenced by a green run, a deployed artifact, or commits in the
    last 14 days. Only the owner may demote.
  keep-narrow: Retained deliberately at current small scope. An agent may propose narrowing further; only the owner
    may widen.
  promote: Evidence supports raising it above its current role, but the raise has not been performed. Only the owner
    may execute it.
  hold: Real work exists, paused behind a named checkable gate. An agent may check the gate and report; only the owner
    may release.
  frozen: Closed with a verdict already reached. Reopening requires an explicit owner ruling, not new interest.
  deferred: Decided to be built later. An agent may not start it; the owner may schedule it.
  spec-only: Prose or schema with zero implementing code. Never upgrade out of spec-only on documentation alone; only
    a code artifact does that.
  retired: Deliberately ended. May still ship as a tombstone or be kept read-only as history. Delete residue only
    where a row says so.
  unknown: Named by the decision record but not established at the artifact. Confidence low by construction; the next
    act is to look, not to decide.
verdict_vocabulary:
  scope: '`verdict` judges the ADJACENT `claim` and nothing else. It never expresses agreement or disagreement with
    the decision record - that is what `contradicts_record` is for.'
  confirmed: The adjacent claim was checked at the artifact and is true.
  contradicted: The adjacent claim was checked at the artifact and is false. No observation in this register currently
    carries this value; observations are written as true statements.
  partially-confirmed: Part of the adjacent claim is true at the artifact and part is false, and the row says which
    is which.
  could-not-check: The probe could not run, or ran without authority to answer. This is a statement about the checking,
    NOT about the claim - could-not-check is never evidence of absence.
  contradicts_record: Separate flag, ABSENT means false. Present and true when a CONFIRMED claim disagrees with the
    decision record.
items:
- key: vuoro-core
  name: Vuoro core (kernel, service, client, evidence)
  repos:
  - /projects/dev/vuoro
  role: Python monorepo whose runnable surface is a schema-described HTTP service (handshake/catalog/invoke) plus
    a thin client and bootstrap CLI, with composition-v4 and an EvidenceSet/EffectGrant/Decision reducer library alongside.
  status: active
  intention: Own only the semantics that survive replacement of the market products around it - what was released,
    what authority was granted, what evidence exists, what was decided.
  waking_condition: n/a - active.
  supersession: The 2026-08-27 effect-intent-projection doc amends direction sections 5/11/15; the direction doc records
    [settled 2026-08-30] that auditctl, not Vuoro, is the canonical home of EvidenceSet and Decision.
  last_verified:
    date: '2026-09-01'
    observations:
    - claim: Deployed and current - the vuoro-shared pod answers handshake with service_version 0.1.59, matching pyproject
        and HEAD 5e51ce9.
      source: kubectl exec -n vuoro-shared ... urlopen /api/meta/v1/handshake
      verdict: confirmed
    - claim: Could not enumerate the live catalog against the support manifest - /api/catalog/v1 rejects an unversioned
        client with HTTP 426. This is a gap in the checking, not evidence that the catalog diverges.
      source: kubectl exec ... urlopen('/api/catalog/v1')
      verdict: could-not-check
    - claim: packages/vuoro-evidence, the settlement-spine implementation, is in neither uv workspace members nor
        pytest testpaths, so CI never runs it.
      source: ~/vuoro/pyproject.toml:15-22,24-33; ~/vuoro/.github/workflows/ci.yml:61
      verdict: confirmed
    - claim: The docs-only nature of the settlement is current as of HEAD - the newest vuoro commit is 9886130, a
        docs(direction) commit settling auditctl as the home of EvidenceSet and Decision, dated 2026-08-30, touching
        documentation only.
      source: git -C ~/vuoro log -1 --date=iso
      verdict: confirmed
  divergence: No resume command and no session-handoff object here. CORRECTION - the resumability OUTCOME is implemented,
    served and evidenced, but in sprintctl, not Vuoro.
  confidence: high
