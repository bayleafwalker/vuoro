  commit: actionq 7c31893 and 6aec1a9
  detail: >-
    The Deployment, Service and contract ConfigMap were deleted from namespace vscode
    after their manifests were captured to docs/evidence/actionq-server-orphan-2026-09-01/.
    Verified safe on three checks - a cluster-wide sweep found only those objects
    containing the name, agent-cockpit reaches PostgreSQL directly through a
    username/password/uri secret rather than calling this service, and the pod logged
    11,520 requests in 24 hours of which every one was a kubelet GET /health and zero
    were real. A sweep afterwards finds no actionq-server object of any kind, so cluster
    and appservice git agree.
    This completed a retirement git had sequenced on 2026-08-20 rather than starting a
    new one - the database resources had been deliberately moved out of the app so they
    would survive it. Every step happened except the last, which failed silently because
    removing a Kustomization removes the owner and abandons its objects instead of
    collecting them. prune only collects what a LIVE Kustomization owns.
    METHOD NOTE - the deletion used kubectl rather than a git change, which is the wrong
    instrument for a Flux-managed cluster. Defensible only because the objects had no
    Kustomization, so no git change could have pruned them. Anything reachable by a git
    change should be changed in git.
