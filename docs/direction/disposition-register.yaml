- key: takeover-experiment
  name: Takeover experiment (coordinator + five-worker swarm, 2026-08-20)
  repos:
  - /projects/dev/_projects/takeover-20260820
  role: A 702-file executed experiment testing whether a coordinated multi-session takeover beats a direct Git handoff
    for continuing interrupted work - 13 design documents including a mermaid topology of one Coordinator over five
    Sol workers, a Python harness with tests, two sealed launch capsules (B2 takeover, CONTROL1 direct control), three
    recorded runs, a hash-verified blind review, and a final adjudication.
  status: frozen
  intention: Not to build a coordination layer, but to decide whether one is worth building. It reached a verdict
    and is closed.
  waking_condition: n/a - adjudicated. Reopening requires an explicit owner ruling against the recorded NARROW verdict,
    not new interest. Its own stop rules are in 06_ACCEPTANCE_KILL_AND_NARROW_GATES.md and the gate status is machine-readable
    in results/GATE-STATUS-CURRENT.json.
  supersession: Supersedes nothing. Its verdict supersedes the ambition of the meta-layer row - it is the empirical
    basis on which multi-agent coordination should stay unbuilt.
  last_verified:
    date: '2026-09-01'
    observations:
    - claim: It was EXECUTED, not merely designed - two launch capsules (launches/B2, launches/CONTROL1) each with
        checkpoint.bundle, HANDOFF.yaml and a launch-context-manifest, three result runs (independent-takeover-001/002,
        direct-control-001), and a byte-preserved blind review with all six payload hashes and the prompt hash passing.
      source: ls -R ~/_projects/takeover-20260820/launches, .../results; ~/_projects/takeover-20260820/results/FINAL-ADJUDICATION.md
      verdict: confirmed
      contradicts_record: true
    - claim: 'The verdict is NARROW with machine-readable gates - ACCEPT-G0 through G7 pass, G8 passes with two packaging
        defects, production_mutations false, and the unblinded review preferred the DIRECT CONTROL path over the takeover
        path. The recorded decision: use direct Git plus a concise HANDOFF, exact receipts, explicit settlement and
        acceptance for bounded single-repository continuation.'
      source: ~/_projects/takeover-20260820/results/GATE-STATUS-CURRENT.json
      verdict: confirmed
    - claim: It has no .agentops-project-folder.json marker and is not generated by materialize_project.py, so it
        is not a project instance despite living under /projects/dev/_projects.
      source: ls ~/_projects/takeover-20260820/.agentops-project-folder.json -> No such file
      verdict: confirmed
  divergence: 'This row exists because v1 tested the meta-layer by identifier spelling and concluded the layer ''was
    never built''. The correction cuts both ways, and the second direction matters more: a coordinated multi-agent
    takeover was run against a fair control and LOST, on record, with hashes.'
