- claim: Cost telemetry is overstated by 5.4-5.9x.
  verdict: partially-confirmed
  finding: 'Overstatement is real; the figure is not. The 5.4-5.9x range appears nowhere under /projects/dev and no
    computation over the live log reproduces it. DEFECT 1, snapshot double-counting - the Stop hook writes one CUMULATIVE
    snapshot per assistant turn, so rows supersede rather than accumulate, and costs.js sums every row. On 1512 rows
    and 292 sessions: naive $138,258.18 versus newest-per-session $20,291.09 = 6.81x whole-log, and per DAY (the cockpit''s
    window) the factor swings 1.00x to 12.16x, so no scalar is correct. DEFECT 2, stale price table - the opus arm
    is exactly 3.0x current published rates, the else-arm bills Sonnet 5 at 1.5x and UNDERSTATES Fable 5 by 3.33x,
    and unknown/synthetic rows are silently priced as Sonnet; price-only factor 2.21x. Combined, the cockpit renders
    15.13x truth. The suggested causes are ruled out at the artifact - cache-read has its own coefficient, subagent
    sums are real spend in the same transcript, and cache read/write are not double-added. No conversion factor can
    restate history; rows must be re-reduced and re-priced. DEFECT 3, new in v2 - the log is written by TWO HOSTS
    and carries no host field. gitops-nixos wires the same hook on the devbox, and the row keys are exactly ts, project,
    session, model, in, out, cost_usd with zero occurrences of "host" across all 1537 rows.'
  sources:
  - ~/agentops/apps/web/lib/cockpit/costs.js:43,45
  - ~/agentops/templates/dispatch/hooks/log-session-cost.sh:176-180
  - ~/gitops-nixos/modules/system/hybrid-dispatch/claude-settings.json:14
  - ~/.claude/session-costs.jsonl (1537 rows as of 2026-09-01; 1512 at v1)
  blocks:
  - Any figure derived from the cockpit status bar or a raw sum of session-costs.jsonl - recompute, never rescale.
  - Any PER-HOST cost figure - the log has no host field and two hosts write it. This is unrecoverable for history,
    not merely uncomputed.
  - Nothing else; the reduction and price fixes are one function, one test line and one jq table, so they belong in
    maintenance rather than the critical path.
  - The controls finding it gates - a shared reducer all three consumers import, plus a test that fails if any consumer
    sums raw rows.
