      source: recomputation over ~/_artifacts/*/audit/*.ndjson and ~/.claude/session-costs.jsonl
      verdict: confirmed
      contradicts_record: true
  divergence: 'v1 omitted appservice entirely, its most consequential structural defect: the outctl row''s headline
