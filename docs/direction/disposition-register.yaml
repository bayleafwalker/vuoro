  intention: Own deployment and cluster configuration only. It holds no work state and no ledger semantics; it is
    where every 'verify at the artifact' check in this register actually lands.
  waking_condition: n/a - active.
  supersession: none.
  last_verified:
    date: '2026-09-01'
    observations:
    - claim: By far the most active repo in the portfolio - 262 commits in the 14 days to 2026-09-01, HEAD edf86bda
        dated 2026-09-01. It is a registered dispatch member at adoption_level dispatchable with six action classes
        enabled (plan, build, review, verify, reconcile, release-ops).
      source: git -C ~/appservice log --since=2026-08-17 --oneline | wc -l -> 262; git log -1 --date=iso; ~/appservice/appservice.dispatch.json
      verdict: confirmed
    - claim: It is the physical location of the outctl cluster residue this register schedules for removal - outctl-pilot-rbac.yaml
        is present and included at kustomization.yaml line 5, the pilot kubeconfig is present with 0600 permissions,
        and all three actors in the vuoro-shared observer policy carry outctl in repo_ids (and actionq-dispatcher,
        itself a tombstone).
      source: ~/appservice/clusters/main/kubernetes/apps/gatus/app/outctl-pilot-rbac.yaml; .../gatus/app/kustomization.yaml:5
      verdict: confirmed
    - claim: It is the largest real consumer in the cost log - the spend open_claim's 30.2% figure and its ~681-of-1512
