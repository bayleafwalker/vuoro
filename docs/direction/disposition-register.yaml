- date: '2026-09-01'
  item: auditctl
  action: Fixture partition implemented at ingestion.
  commit: auditctl 0305f65
  detail: >-
    stream_class (live|fixture) is resolver-derived from AUDITCTL_STREAM_CLASS, so a
    publisher cannot forge it through a payload. Optional by construction, because the
    required set is validated all-or-nothing and a sixth required field would have
    rejected every event already carrying the five-field form. Migration 4 lifts it into
    its own column. Unset resolves to live; an unrecognised value is refused.
  supersedes: items[key=auditctl].waking_condition clause (1), now satisfied. Clause (2) still open.
- date: '2026-09-01'
  item: evidence-set
  action: Consolidation gate resolved -- adapter, not supersession.
  commit: auditctl 7772aac
  detail: >-
    The two implementations are not divergent definitions of one object. bindery-core's
    evidencev1 is an agreement test (did independent accounts of one execution agree);
    vuoro-evidence's is a sufficiency test (is there enough valid evidence to act without
    observing again). A bindery evidence set maps onto exactly one vuoro EvidenceItem,
    its evidence_set_id already being a sha256 content address. The field-by-field
    mapping is recorded in auditctl docs/contracts/evidence-set-and-decision.md. No
    supersession applies and no third implementation was added.
  supersedes: items[key=evidence-set].waking_condition
- date: '2026-09-01'
  item: decision
  action: Gate WITHDRAWN -- Decision must not live in auditctl.
  commit: auditctl 7772aac
  detail: >-
    The 2026-08-30 settlement placed Decision in a store whose validator refuses it.
    record_class is hard-validated to "observation" (auditctl validation.py:372), and
    AuditContext.as_record states the rule it enforces - auditctl records conformance, it
    does not state desired state. A Decision is a judgement about what should follow from
    evidence, which is desired state. Admitting it means relaxing the one constraint that
    keeps the store a record of what happened, so it is an owner ruling about the
    boundary rather than a schema change. Acceptance Lab, which already emits terminal
