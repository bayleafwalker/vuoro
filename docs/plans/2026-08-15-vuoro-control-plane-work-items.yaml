  failureTests:
  - scenario: Control API restart during active ACP turn
    expected: Runner replays updates from watermark; no duplicate prompt; run remains recoverable.
  - scenario: Runner loses cluster connectivity
    expected: Existing allowed local work continues; no new claims or elevated credentials; events spool.
  - scenario: Runner restarts with unacknowledged events
    expected: New runner_instance_ref; WAL replays; stale boot cannot settle.
  - scenario: Old runner reconnects after replacement
    expected: Lease epoch rejects writes, credential tickets, grants, and child creation.
  - scenario: Harness dies after external effect
    expected: Run becomes uncertain/interrupted; Outctl evidence is available; no automatic replay.
  - scenario: Duplicate event and settle requests
    expected: Idempotency produces one event sequence and one final result.
  - scenario: cred-broker unavailable
    expected: No new credentials; grant state remains intact; unrelated work continues.
  - scenario: OpenBao unavailable behind broker
    expected: Broker reports provider failure; no secret fallback; unrelated work continues.
  - scenario: Credential expires mid-run
    expected: Renewal follows class policy; failure is explicit; material is removed.
  - scenario: OPA unavailable in observe mode
    expected: Evaluation failure recorded; work continues.
  - scenario: OPA unavailable in enforcement mode
    expected: Declared consequential effects fail closed; local-safe work follows policy.
  - scenario: 200 MB output contains synthetic secrets
    expected: No plaintext central retention; manifest records redaction and raw expiry.
  - scenario: N-1 runner/broker during upgrade
    expected: Compatible work drains; incompatible claims/tickets are rejected before effect.
  - scenario: Cross-host handoff
    expected: Successor receives Git/evidence/plan state; opaque provider session is not assumed portable.
  - scenario: Capacity pool exhausted
    expected: Path enters blocked_capacity and resumes after slot release.
  risks:
  - risk: Duplicate external effect after partition
    severity: Critical
    why: Fenced leases do not undo an effect already started.
    mitigation: Payload-bound grants, prepare/commit verification, uncertain state, no automatic replay.
  - risk: Credential leakage through evidence
    severity: Critical
    why: Tools may echo tokens or files.
    mitigation: Short leases, process-scoped injection, in-memory exact redaction, sensitive capture, disclosure tests.
  - risk: cred-broker and Vuoro duplicate authority
    severity: High
    why: A broker that decides work policy becomes a second control plane.
    mitigation: Broker validates signed tickets and provider constraints; Vuoro owns work, grant, and policy authority.
  - risk: OpenBao path coupling
    severity: High
    why: Domain or agents may depend on mount layout.
    mitigation: Logical CredentialCatalog/v1; mapping stays inside cred-broker; exit note required.
  - risk: ACP adapter churn
    severity: High
    why: Adapters may lag protocol or capabilities.
    mitigation: Pin versions, persist capabilities, internal Runner/v1, explicit failures.
  - risk: Policy input omits decisive context
    severity: High
    why: OPA can make precise but wrong decisions.
    mitigation: Treat input schema as core; observe full backlog; test every deny/grant branch.
  - risk: Local spool exhaustion
    severity: High
    why: Long outages or huge logs can fill disk.
    mitigation: Quotas, backpressure, alerts, bounded continuation, no silent deletion.
  - risk: Subscription capacity misdiagnosed
    severity: Medium
    why: More sessions do not create more provider quota.
    mitigation: Global capacity pools and blocked_capacity state.
  - risk: Upgrade strands old runners/broker
    severity: High
    why: Version skew can stall or corrupt execution.
    mitigation: N-1 matrix, report card, drain/reject, additive schemas.
  - risk: Optional integration sprawl
    severity: Medium
    why: Maintenance rises faster than value.
    mitigation: Named-failure gates, one-at-a-time pilots, exit note before adoption.
  dependencyExitNotes:
  - dependency: ACP
    value: Standardized local harness session control and structured updates.
    contracts:
    - Runner/v1
    - HarnessCapabilities/v1
    - NormalizedSessionEvent/v1
    exit: Replace the adapter behind Runner/v1. Canonical run, session, event, evidence, credential, and grant state
      remains Vuoro-native.
  - dependency: OPA
    value: Policy evaluation, tests, decision IDs, bundles, and decision logging.
    contracts:
    - PolicyInput/v1
    - PolicyDecision/v1
    exit: Swap the decision adapter while retaining Vuoro schemas and persisted decisions. Rego is the bounded migration
      surface.
  - dependency: OpenBao
    value: Secret storage, issuance, lease, renewal, rotation, revocation, and wrapping.
    contracts:
    - CredentialCatalog/v1
    - CredentialTicket/v1
    - CredentialLeaseRef/v1
    - Grant/v1
    - EffectDescriptor/v1
    exit: Implement another provider behind cred-broker and remap logical credentials. Secret values are not migration
      data; Vuoro keeps metadata and audit linkage.
  - dependency: cred-broker (first-party existing component)
    value: Stable actor-facing credential delivery and OpenBao provider translation.
    contracts:
    - CredentialTicket/v1
    - CredentialLeaseRef/v1
    - CredentialCatalog/v1
    exit: Move provider mapping/delivery behind another service that accepts the same tickets. Do not reimplement grant
      or policy authority inside the replacement.
