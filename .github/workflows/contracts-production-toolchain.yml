name: contracts production toolchain

on:
  workflow_call:
    inputs:
      run-repository-suite:
        type: boolean
        default: false
        required: false
    outputs:
      artifact_name:
        value: ${{ jobs.qualify.outputs.artifact_name }}
      artifact_id:
        value: ${{ jobs.qualify.outputs.artifact_id }}
      wheel_basename:
        value: ${{ jobs.qualify.outputs.wheel_basename }}
      wheel_sha256:
        value: ${{ jobs.qualify.outputs.wheel_sha256 }}
      source_sha:
        value: ${{ jobs.qualify.outputs.source_sha }}

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      wheel_basename: ${{ steps.candidate.outputs.wheel_basename }}
      wheel_sha256: ${{ steps.candidate.outputs.wheel_sha256 }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
    env:
      VUORO_OPS_REQUIRE_PG16: "1"
      VUORO_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.13.1"
          python-version: "3.13.16"
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Restore locked contract toolchain and test environments
        shell: bash
        run: |
          set -euo pipefail
          qualified_python_root="$RUNNER_TEMP/contracts-python-20261001"
          python_archive="$RUNNER_TEMP/contracts-python-20261001.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$python_archive" \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.13.16%2B20261001-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'
          printf '%s  %s\n' 'ffcb50e716789d1a6e1db5e745d4d194ac8ed9b015ccf5eabcaccb179a25e4a8' "$python_archive" | sha256sum --check
          mkdir "$qualified_python_root"
          tar -xzf "$python_archive" -C "$qualified_python_root"
          qualified_python="$qualified_python_root/python/bin/python3.13"
          test "$(sha256sum "$qualified_python" | cut -d ' ' -f1)" = 'f8188f8dec8f4ae9865dc6789323327c50bb275a5a301373d675464fdbbf933f'
          printf 'qualified_python=%s\n' "$qualified_python" >> "$GITHUB_ENV"
          uv --version
          test "$(uv --version | cut -d ' ' -f2)" = "0.13.1"
          nix develop ./tools/contracts/toolchain --command bash -euc '
            test "$(node --version)" = "v24.21.0"
            test "$(npm --version)" = "11.19.0"
            npm ci --prefix tools/contracts --ignore-scripts --no-audit --no-fund
          '
          uv sync --project tools/contracts --python "$qualified_python" --locked --no-install-project
          test "$(tools/contracts/.venv/bin/python --version)" = "Python 3.13.16"
          uv sync --python "$qualified_python" --all-packages --all-extras --locked
          test "$(.venv/bin/python --version)" = "Python 3.13.16"
      - name: Run exact production compiler and SDK contract gates
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$(nix develop ./tools/contracts/toolchain --command bash -euc 'command -v node')"
          test "$("$node_bin" --version)" = "v24.21.0"
          export VUORO_CONTRACT_NODE="$node_bin"
          export VUORO_CONTRACT_PYTHON="${GITHUB_WORKSPACE}/tools/contracts/.venv/bin/python"
          export VUORO_CONTRACT_DECODER="${GITHUB_WORKSPACE}/tools/contracts/templates/strict-json.ts"
          export PYTHONPATH="${GITHUB_WORKSPACE}/packages/vuoro-contracts/src"
          export PYTHONDONTWRITEBYTECODE=1
          .venv/bin/python - "$VUORO_CONTRACT_NODE" "$VUORO_CONTRACT_PYTHON" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          expected = json.loads(pathlib.Path("tools/contracts/toolchain/tool-artifacts.json").read_text())["executables"]
          paths = {"node": pathlib.Path(sys.argv[1]), "python": pathlib.Path(sys.argv[2]).resolve(), "ruff": pathlib.Path("tools/contracts/.venv/bin/ruff").resolve()}
          actual = {name: hashlib.sha256(path.read_bytes()).hexdigest() for name, path in paths.items()}
          print(json.dumps({"expected": expected, "actual": actual, "paths": {name: str(path) for name, path in paths.items()}}, sort_keys=True))
          assert actual == expected, "Restore exactly the qualified executable artifacts before generation"
          PY
          .venv/bin/python -m pytest -q --tb=short -o addopts= \
            packages/vuoro-contracts/tests \
            --ignore=packages/vuoro-contracts/tests/test_cross_language_vectors.py \
            --ignore=packages/vuoro-contracts/tests/test_mcp_projection.py \
            --ignore=packages/vuoro-contracts/tests/test_sdk_wheel_install.py \
            packages/vuoro-client/tests/test_generated_contract_boundary.py \
            packages/vuoro-service/tests/test_generated_contract_foundation.py \
            --junitxml="$RUNNER_TEMP/contracts-pytest.xml"
          .venv/bin/python - "$RUNNER_TEMP/contracts-pytest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).getroot().findall(".//testcase")
          skipped = sum(case.find("skipped") is not None for case in cases)
          failed = sum(case.find("failure") is not None for case in cases)
          errors = sum(case.find("error") is not None for case in cases)
          assert (len(cases), skipped, failed, errors) == (263, 0, 0, 0), (len(cases), skipped, failed, errors)
          PY
      - name: Run MCP definition-only projection gate
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$(nix develop ./tools/contracts/toolchain --command bash -euc 'command -v node')"
          test "$("$node_bin" --version)" = "v24.21.0"
          export VUORO_CONTRACT_NODE="$node_bin"
          export VUORO_CONTRACT_PYTHON="${GITHUB_WORKSPACE}/tools/contracts/.venv/bin/python"
          export VUORO_CONTRACT_DECODER="${GITHUB_WORKSPACE}/tools/contracts/templates/strict-json.ts"
          export PYTHONPATH="${GITHUB_WORKSPACE}/packages/vuoro-contracts/src"
          .venv/bin/python -m pytest -q --tb=short -o addopts= \
            packages/vuoro-contracts/tests/test_mcp_projection.py \
            --junitxml="$RUNNER_TEMP/contracts-mcp-projection.xml"
          .venv/bin/python - "$RUNNER_TEMP/contracts-mcp-projection.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).getroot().findall(".//testcase")
          skipped = sum(case.find("skipped") is not None for case in cases)
          failed = sum(case.find("failure") is not None for case in cases)
          errors = sum(case.find("error") is not None for case in cases)
          assert (len(cases), skipped, failed, errors) == (10, 0, 0, 0), (len(cases), skipped, failed, errors)
          PY
      - name: Run portable wire vectors and installed SDK wheel tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}/packages/vuoro-contracts/src"
          .venv/bin/python -m pytest -q --tb=short -o addopts= \
            packages/vuoro-contracts/tests/test_cross_language_vectors.py \
            packages/vuoro-contracts/tests/test_sdk_wheel_install.py \
            --junitxml="$RUNNER_TEMP/contracts-sdk-portable.xml"
          .venv/bin/python - "$RUNNER_TEMP/contracts-sdk-portable.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).getroot().findall(".//testcase")
          skipped = sum(case.find("skipped") is not None for case in cases)
          failed = sum(case.find("failure") is not None for case in cases)
          errors = sum(case.find("error") is not None for case in cases)
          assert (len(cases), skipped, failed, errors) == (20, 0, 0, 0), (len(cases), skipped, failed, errors)
          PY
      - name: Run separate portable Python namespace and resource gate
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}/packages/vuoro-contracts/src"
          .venv/bin/python -m pytest -q --tb=short -o addopts= \
            tools/contracts/portable_tests/test_namespace_portability.py \
            --junitxml="$RUNNER_TEMP/contracts-portable.xml"
          .venv/bin/python - "$RUNNER_TEMP/contracts-portable.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).getroot().findall(".//testcase")
          skipped = sum(case.find("skipped") is not None for case in cases)
          failed = sum(case.find("failure") is not None for case in cases)
          errors = sum(case.find("error") is not None for case in cases)
          assert (len(cases), skipped, failed, errors) == (26, 0, 0, 0), (len(cases), skipped, failed, errors)
          PY
      - name: Build the actual vuoro-contracts wheel
        run: uv build --package vuoro-contracts --wheel --out-dir dist/vuoro-contracts --no-create-gitignore
      - name: Build and consume two installed contract SDK wheels offline
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$(nix develop ./tools/contracts/toolchain --command bash -euc 'command -v node')"
          test "$("$node_bin" --version)" = "v24.21.0"
          export VUORO_CONTRACT_NODE="$node_bin"
          export VUORO_CONTRACT_PYTHON="${GITHUB_WORKSPACE}/tools/contracts/.venv/bin/python"
          export PYTHONPATH="${GITHUB_WORKSPACE}/packages/vuoro-contracts/src"
          first="$RUNNER_TEMP/contract-probe-v1"
          second="$RUNNER_TEMP/contract-probe-v2"
          .venv/bin/python scripts/contracts/generate.py \
            --source tools/contracts/fixtures/probe --output "$first" \
            --contract-id 'probe/v1' --write
          .venv/bin/python scripts/contracts/generate.py \
            --source tools/contracts/fixtures/probe --output "$second" \
            --contract-id 'probe/v2' --write
          .venv/bin/python scripts/contracts/build_python_sdk.py \
            --bundle "$first" --output-dir "$RUNNER_TEMP/sdk-wheels"
          .venv/bin/python scripts/contracts/build_python_sdk.py \
            --bundle "$second" --output-dir "$RUNNER_TEMP/sdk-wheels"
          .venv/bin/python - "$first" "$second" "$RUNNER_TEMP/sdk-integrity-digests.json" <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import sys
          digests = {}
          for root in map(Path, sys.argv[1:3]):
              manifest = json.loads((root / "operation-manifest.json").read_bytes())
              package = "vuoro_contract_" + sha256(manifest["contractId"].encode("utf-8")).hexdigest() + "_client"
              integrity = root / "clients/python" / package / "data/integrity.json"
              digests[manifest["contractId"]] = sha256(integrity.read_bytes()).hexdigest()
          Path(sys.argv[3]).write_text(json.dumps(digests, sort_keys=True) + "\n")
          PY
          .venv/bin/python - "$GITHUB_WORKSPACE/uv.lock" "$RUNNER_TEMP/sdk-wheel-requirements.txt" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path(sys.argv[1]).read_text())
          packages = {item["name"]: item for item in lock["package"]}
          if len(packages) != len(lock["package"]):
              raise SystemExit("dependency lock contains multiple versions for an SDK consumer package")
          pending = ["attrs", "httpx", "typing-extensions", "jsonschema", "referencing"]
          selected = set()
          while pending:
              name = pending.pop()
              if name in selected:
                  continue
              package = packages.get(name)
              if package is None or package.get("source", {}).get("registry") != "https://pypi.org/simple":
                  raise SystemExit(f"expected registry-pinned SDK dependency {name}")
              selected.add(name)
              pending.extend(dep["name"] for dep in package.get("dependencies", []))
          requirements = []
          for name in sorted(selected):
              package = packages[name]
              hashes = sorted({wheel["hash"] for wheel in package.get("wheels", [])
                               if isinstance(wheel.get("hash"), str) and wheel["hash"].startswith("sha256:")})
              if not hashes:
                  raise SystemExit(f"locked SDK dependency has no wheel hashes: {name}")
              requirements.append(
                  f"{name}=={package['version']} "
                  + " ".join(f"--hash={digest}" for digest in hashes)
              )
          Path(sys.argv[2]).write_text("\n".join(requirements) + "\n")
          PY
          wheelhouse="$RUNNER_TEMP/sdk-dependency-wheels"
          mkdir -p "$wheelhouse"
          PIP_CONFIG_FILE=/dev/null "$qualified_python" -m pip download \
            --disable-pip-version-check --isolated --no-deps --only-binary=:all: \
            --require-hashes --index-url https://pypi.org/simple \
            --dest "$wheelhouse" -r "$RUNNER_TEMP/sdk-wheel-requirements.txt"
          consumer="$RUNNER_TEMP/vuoro-contract-sdks-consumer"
          uv venv --python "$qualified_python" "$consumer"
          uv pip install --offline --no-index --no-config \
            --find-links "$wheelhouse" --python "$consumer/bin/python" \
            dist/vuoro-contracts/*.whl "$RUNNER_TEMP"/sdk-wheels/*.whl
          cd "$RUNNER_TEMP"
          "$consumer/bin/python" -I - <<'PY'
          from hashlib import sha256
          from importlib import import_module, resources
          import json
          from pathlib import Path
          import sys

          import httpx
          from vuoro_contracts import ContractBundle

          external_digests = json.loads(Path("sdk-integrity-digests.json").read_text())
          expected = {
              "probe/v1": "vuoro_contract_" + sha256(b"probe/v1").hexdigest() + "_client",
              "probe/v2": "vuoro_contract_" + sha256(b"probe/v2").hexdigest() + "_client",
          }
          assert Path(import_module("vuoro_contracts").__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          for contract_id, package_name in expected.items():
              package = import_module(package_name)
              import_module(package_name + ".api.default.submit")
              import_module(package_name + ".validated_client")
              assert Path(package.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
              root = resources.files(package_name).joinpath("data")
              integrity = root.joinpath("integrity.json").read_bytes()
              digest = external_digests[contract_id]
              assert sha256(integrity).hexdigest() == digest
              bundle = ContractBundle.load(root, integrity_sha256=digest)
              assert bundle.manifest["contractId"] == contract_id
              assert Path(package.__file__).parent.joinpath("__pycache__").is_dir()
              requests = []
              def respond(request):
                  requests.append(request)
                  return httpx.Response(200, json={"state": "ready", "revision": "1"}, request=request)
              transport = httpx.Client(
                  base_url="https://contracts.invalid",
                  transport=httpx.MockTransport(respond),
                  trust_env=False,
              )
              native = import_module(package_name + ".client").Client(
                  base_url="https://contracts.invalid"
              ).set_httpx_client(transport)
              guarded = import_module(package_name + ".validated_client").create_validated_client(
                  client=native, integrity_sha256=digest
              )
              result = guarded.submit(
                  key="k", body={"revision": "1", "enabled": True, "nested": {"label": "x"}}
              )
              assert result.status == 200 and result.body == {"state": "ready", "revision": "1"}
              assert len(requests) == 1 and requests[0].method == "POST"
              transport.close()
          print("two generated SDK wheels import independently with bytecode enabled")
          PY
      - name: Exercise wheel resources in an isolated consumer
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/vuoro-contracts-wheel-consumer"
          uv venv --python "$qualified_python" "$consumer"
          uv pip install --no-config --python "$consumer/bin/python" dist/vuoro-contracts/*.whl
          cd "$RUNNER_TEMP"
          "$consumer/bin/python" -I - <<'PY'
          import importlib.resources as resources
          import json
          import pathlib
          import sys
          import vuoro_contracts
          from jsonschema import Draft202012Validator
          formats = resources.files("vuoro_contracts").joinpath("formats")
          integrity = json.loads(formats.joinpath("integrity.schema.json").read_text(encoding="utf-8"))
          manifest = json.loads(formats.joinpath("operation-manifest.schema.json").read_text(encoding="utf-8"))
          assert pathlib.Path(vuoro_contracts.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve())
          assert integrity["properties"]["schemaVersion"]["const"] == "vuoro-contract-integrity/v1"
          assert manifest["$id"] == "operation-manifest.schema.json"
          Draft202012Validator.check_schema(integrity)
          Draft202012Validator.check_schema(manifest)
          print("wheel package imports and both packaged schemas validate")
          PY
      - name: Run repository release gates
        if: ${{ inputs.run-repository-suite }}
        shell: bash
        env:
          VUORO_OPS_REQUIRE_PG16: "1"
          VUORO_PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          uv sync --all-packages --all-extras --locked --python "$qualified_python"
          uv build --package vuoro-client --wheel --out-dir dist/vuoro-client
          uv build --package vuoro-service --wheel --out-dir dist/vuoro-service
          uv build --package vuoro-schema-runtime --wheel --out-dir dist/vuoro-schema-runtime
          uv build --package vuoro-adapter-kit --wheel --out-dir dist/vuoro-adapter-kit
          uv build --package vuoro-workspace --wheel --out-dir dist/vuoro-workspace
          uv build --project packages/vuoro-demo --wheel --out-dir dist/vuoro-demo
          uv run --no-sync pytest \
            --ignore=packages/vuoro-contracts/tests/test_production_generation.py \
            --ignore=packages/vuoro-contracts/tests/test_production_generation_regressions.py
      - id: candidate
        name: Create qualified release candidate receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt_tmp="$(mktemp "$RUNNER_TEMP/contracts-candidate.XXXXXX")"
          .venv/bin/python -I scripts/contracts/release_candidate.py create \
            --wheel-dir dist/vuoro-contracts --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --junit "$RUNNER_TEMP/contracts-pytest.xml" > "$receipt_tmp"
          mv -- "$receipt_tmp" dist/vuoro-contracts/candidate.json
          receipt=dist/vuoro-contracts/candidate.json
          echo "artifact_name=$(jq -r .artifact_name "$receipt")" >> "$GITHUB_OUTPUT"
          echo "wheel_basename=$(jq -r .wheel_basename "$receipt")" >> "$GITHUB_OUTPUT"
          echo "wheel_sha256=$(jq -r .wheel_sha256 "$receipt")" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(jq -r .source_sha "$receipt")" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: |
            dist/vuoro-contracts/*.whl
            dist/vuoro-contracts/candidate.json
          if-no-files-found: error
