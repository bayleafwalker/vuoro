name: contracts production toolchain

on:
  workflow_call:
    inputs:
      run-repository-suite:
        type: boolean
        default: false
        required: false
    outputs:
      artifact_name:
        value: ${{ jobs.qualify.outputs.artifact_name }}
      artifact_id:
        value: ${{ jobs.qualify.outputs.artifact_id }}
      wheel_basename:
        value: ${{ jobs.qualify.outputs.wheel_basename }}
      wheel_sha256:
        value: ${{ jobs.qualify.outputs.wheel_sha256 }}
      source_sha:
        value: ${{ jobs.qualify.outputs.source_sha }}

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      wheel_basename: ${{ steps.candidate.outputs.wheel_basename }}
      wheel_sha256: ${{ steps.candidate.outputs.wheel_sha256 }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
    env:
      VUORO_OPS_REQUIRE_PG16: "1"
      VUORO_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.13.1"
          python-version: "3.13.16"
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Restore locked contract toolchain and test environments
        shell: bash
        run: |
          set -euo pipefail
          qualified_python_root="$RUNNER_TEMP/contracts-python-20261001"
          python_archive="$RUNNER_TEMP/contracts-python-20261001.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$python_archive" \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20261001/cpython-3.13.16%2B20261001-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'
          printf '%s  %s\n' 'ffcb50e716789d1a6e1db5e745d4d194ac8ed9b015ccf5eabcaccb179a25e4a8' "$python_archive" | sha256sum --check
          mkdir "$qualified_python_root"
          tar -xzf "$python_archive" -C "$qualified_python_root"
          qualified_python="$qualified_python_root/python/bin/python3.13"
          test "$(sha256sum "$qualified_python" | cut -d ' ' -f1)" = 'f8188f8dec8f4ae9865dc6789323327c50bb275a5a301373d675464fdbbf933f'
          printf 'qualified_python=%s\n' "$qualified_python" >> "$GITHUB_ENV"
          uv --version
          test "$(uv --version | cut -d ' ' -f2)" = "0.13.1"
          nix develop ./tools/contracts/toolchain --command bash -euc '
            test "$(node --version)" = "v24.21.0"
            test "$(npm --version)" = "11.19.0"
            npm ci --prefix tools/contracts --ignore-scripts --no-audit --no-fund
          '
          uv sync --project tools/contracts --python "$qualified_python" --locked --no-install-project
          test "$(tools/contracts/.venv/bin/python --version)" = "Python 3.13.16"
          uv sync --python "$qualified_python" --all-packages --all-extras --locked
          test "$(.venv/bin/python --version)" = "Python 3.13.16"
      - name: Run exact production compiler and SDK contract gates
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$(nix develop ./tools/contracts/toolchain --command bash -euc 'command -v node')"
          test "$("$node_bin" --version)" = "v24.21.0"
          export VUORO_CONTRACT_NODE="$node_bin"
          export VUORO_CONTRACT_PYTHON="${GITHUB_WORKSPACE}/tools/contracts/.venv/bin/python"
          export VUORO_CONTRACT_DECODER="${GITHUB_WORKSPACE}/tools/contracts/templates/strict-json.ts"
          export PYTHONPATH="${GITHUB_WORKSPACE}/packages/vuoro-contracts/src"
          export PYTHONDONTWRITEBYTECODE=1
          .venv/bin/python - "$VUORO_CONTRACT_NODE" "$VUORO_CONTRACT_PYTHON" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          expected = json.loads(pathlib.Path("tools/contracts/toolchain/tool-artifacts.json").read_text())["executables"]
          paths = {"node": pathlib.Path(sys.argv[1]), "python": pathlib.Path(sys.argv[2]).resolve(), "ruff": pathlib.Path("tools/contracts/.venv/bin/ruff").resolve()}
          actual = {name: hashlib.sha256(path.read_bytes()).hexdigest() for name, path in paths.items()}
          print(json.dumps({"expected": expected, "actual": actual, "paths": {name: str(path) for name, path in paths.items()}}, sort_keys=True))
          assert actual == expected, "Restore exactly the qualified executable artifacts before generation"
          PY
          .venv/bin/python -m pytest -q --tb=short -o addopts= \
            packages/vuoro-contracts/tests \
            packages/vuoro-client/tests/test_generated_contract_boundary.py \
            packages/vuoro-service/tests/test_generated_contract_foundation.py \
            --junitxml="$RUNNER_TEMP/contracts-pytest.xml"
          .venv/bin/python - "$RUNNER_TEMP/contracts-pytest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).getroot().findall(".//testcase")
          skipped = sum(case.find("skipped") is not None for case in cases)
          failed = sum(case.find("failure") is not None for case in cases)
          errors = sum(case.find("error") is not None for case in cases)
          assert (len(cases), skipped, failed, errors) == (257, 0, 0, 0), (len(cases), skipped, failed, errors)
          PY
      - name: Build the actual vuoro-contracts wheel
        run: uv build --package vuoro-contracts --wheel --out-dir dist/vuoro-contracts --no-create-gitignore
      - name: Exercise wheel resources in an isolated consumer
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/vuoro-contracts-wheel-consumer"
          uv venv --python "$qualified_python" "$consumer"
          uv pip install --no-config --python "$consumer/bin/python" dist/vuoro-contracts/*.whl
          cd "$RUNNER_TEMP"
          "$consumer/bin/python" -I - <<'PY'
          import importlib.resources as resources
          import json
          import pathlib
          import sys
          import vuoro_contracts
          from jsonschema import Draft202012Validator
          formats = resources.files("vuoro_contracts").joinpath("formats")
          integrity = json.loads(formats.joinpath("integrity.schema.json").read_text(encoding="utf-8"))
          manifest = json.loads(formats.joinpath("operation-manifest.schema.json").read_text(encoding="utf-8"))
          assert pathlib.Path(vuoro_contracts.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve())
          assert integrity["properties"]["schemaVersion"]["const"] == "vuoro-contract-integrity/v1"
          assert manifest["$id"] == "operation-manifest.schema.json"
          Draft202012Validator.check_schema(integrity)
          Draft202012Validator.check_schema(manifest)
          print("wheel package imports and both packaged schemas validate")
          PY
      - name: Run repository release gates
        if: ${{ inputs.run-repository-suite }}
        shell: bash
        env:
          VUORO_OPS_REQUIRE_PG16: "1"
          VUORO_PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          uv sync --all-packages --all-extras --locked --python "$qualified_python"
          uv build --package vuoro-client --wheel --out-dir dist/vuoro-client
          uv build --package vuoro-service --wheel --out-dir dist/vuoro-service
          uv build --package vuoro-schema-runtime --wheel --out-dir dist/vuoro-schema-runtime
          uv build --package vuoro-adapter-kit --wheel --out-dir dist/vuoro-adapter-kit
          uv build --package vuoro-workspace --wheel --out-dir dist/vuoro-workspace
          uv build --project packages/vuoro-demo --wheel --out-dir dist/vuoro-demo
          uv run --no-sync pytest \
            --ignore=packages/vuoro-contracts/tests/test_production_generation.py \
            --ignore=packages/vuoro-contracts/tests/test_production_generation_regressions.py
      - id: candidate
        name: Create qualified release candidate receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt_tmp="$(mktemp "$RUNNER_TEMP/contracts-candidate.XXXXXX")"
          .venv/bin/python -I scripts/contracts/release_candidate.py create \
            --wheel-dir dist/vuoro-contracts --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --junit "$RUNNER_TEMP/contracts-pytest.xml" > "$receipt_tmp"
          mv -- "$receipt_tmp" dist/vuoro-contracts/candidate.json
          receipt=dist/vuoro-contracts/candidate.json
          echo "artifact_name=$(jq -r .artifact_name "$receipt")" >> "$GITHUB_OUTPUT"
          echo "wheel_basename=$(jq -r .wheel_basename "$receipt")" >> "$GITHUB_OUTPUT"
          echo "wheel_sha256=$(jq -r .wheel_sha256 "$receipt")" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(jq -r .source_sha "$receipt")" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: |
            dist/vuoro-contracts/*.whl
            dist/vuoro-contracts/candidate.json
          if-no-files-found: error
