name: Publish Vuoro Python package

on:
  push:
    tags:
      - "vuoro-client-v*"
      - "vuoro-bootstrap-v*"
      - "vuoro-service-v*"

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - id: package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          package="${tag%-v*}"
          case "$package" in
            vuoro-client|vuoro-bootstrap|vuoro-service) ;;
            *) echo "unsupported package tag: $tag" >&2; exit 1 ;;
          esac
          echo "name=$package" >> "$GITHUB_OUTPUT"
          echo "version=${tag#*-v}" >> "$GITHUB_OUTPUT"
      - name: Synchronize the complete locked workspace
        run: uv sync --all-packages --all-extras --locked
      - name: Run the complete repository test suite
        run: uv run pytest
      - name: Build and exercise the complete release candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/gate
          uv build --package vuoro-client --wheel --out-dir dist/gate
          uv build --package vuoro-bootstrap --wheel --out-dir dist/gate
          uv build --package vuoro-service --wheel --out-dir dist/gate
          uv run --package vuoro-service --extra test python \
            scripts/validate_release_contract.py dist/gate/*.whl --release
          uv venv --python 3.12 /tmp/vuoro-release-conformance
          uv pip install --python /tmp/vuoro-release-conformance/bin/python \
            dist/gate/*.whl 'httpx>=0.27,<1'
          /tmp/vuoro-release-conformance/bin/python \
            scripts/validate_served_conformance.py
      - name: Select the gated wheel for publication
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          package="${{ steps.package.outputs.name }}"
          wheel_stem="${package//-/_}"
          shopt -s nullglob
          wheels=(dist/gate/"${wheel_stem}"-*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "expected exactly one gated wheel for $package, found ${#wheels[@]}" >&2
            exit 1
          fi
          mkdir -p dist/publish
          wheel="dist/publish/$(basename "${wheels[0]}")"
          cp -- "${wheels[0]}" "$wheel"
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
      - name: Validate the selected gated wheel against its tag
        run: >-
          uv run --package vuoro-service --extra test python
          scripts/validate_release_contract.py
          ${{ steps.publication.outputs.wheel }}
          --tag "${GITHUB_REF_NAME}"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/publish/
          skip-existing: false
      - uses: actions/attest@v4
        with:
          subject-path: "${{ steps.publication.outputs.wheel }}"
