name: Publish Vuoro Python package

on:
  push:
    tags:
      - "vuoro-client-v*"
      - "vuoro-bootstrap-v*"
      - "vuoro-service-v*"

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - id: package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          package="${tag%-v*}"
          case "$package" in
            vuoro-client|vuoro-bootstrap|vuoro-service) ;;
            *) echo "unsupported package tag: $tag" >&2; exit 1 ;;
          esac
          echo "name=$package" >> "$GITHUB_OUTPUT"
          echo "version=${tag#*-v}" >> "$GITHUB_OUTPUT"
      - name: Build and exercise the complete release candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/gate
          uv build --package vuoro-client --wheel --out-dir dist/gate
          uv build --package vuoro-bootstrap --wheel --out-dir dist/gate
          uv build --package vuoro-service --wheel --out-dir dist/gate
          uv run --package vuoro-service --extra test python \
            scripts/validate_release_contract.py dist/gate/*.whl --release
          uv venv --python 3.12 /tmp/vuoro-release-conformance
          uv pip install --python /tmp/vuoro-release-conformance/bin/python \
            dist/gate/*.whl 'httpx>=0.27,<1'
          /tmp/vuoro-release-conformance/bin/python \
            scripts/validate_served_conformance.py
      - run: uv build --package "${{ steps.package.outputs.name }}" --wheel --out-dir dist/publish
      - run: >-
          uv run --package vuoro-service --extra test python
          scripts/validate_release_contract.py
          dist/publish/${{ steps.package.outputs.name }}-*.whl
          --tag "${GITHUB_REF_NAME}"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/publish/
          skip-existing: false
      - uses: actions/attest@v4
        with:
          subject-path: "dist/publish/${{ steps.package.outputs.name }}-*.whl"
