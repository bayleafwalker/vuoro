name: Publish Vuoro Python package

on:
  push:
    tags:
      - "vuoro-client-v*"
      - "vuoro-bootstrap-v*"
      - "vuoro-service-v*"
      - "vuoro-schema-runtime-v*"
      - "vuoro-adapter-kit-v*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout pinned managed-capsule renderer
        uses: actions/checkout@v6
        with:
          repository: bayleafwalker/agentops
          ref: 67b9ec347ce781923907896efe03796a0df5d364
          path: ../agentops
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - id: package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          package="${tag%-v*}"
          case "$package" in
            vuoro-client|vuoro-bootstrap|vuoro-service|vuoro-schema-runtime|vuoro-adapter-kit) ;;
            *) echo "unsupported package tag: $tag" >&2; exit 1 ;;
          esac
          echo "name=$package" >> "$GITHUB_OUTPUT"
          echo "version=${tag#*-v}" >> "$GITHUB_OUTPUT"
      - name: Synchronize the complete locked workspace
        run: uv sync --all-packages --all-extras --locked
      - name: Build the complete release candidate once
        run: |
          uv build --package vuoro-client --wheel --out-dir dist/vuoro-client
          uv build --package vuoro-bootstrap --wheel --out-dir dist/vuoro-bootstrap
          uv build --package vuoro-service --wheel --out-dir dist/vuoro-service
          uv build --package vuoro-schema-runtime --wheel --out-dir dist/vuoro-schema-runtime
          uv build --package vuoro-adapter-kit --wheel --out-dir dist/vuoro-adapter-kit
      - name: Run the complete repository test suite
        run: uv run pytest
      - name: Exercise the complete release candidate
        shell: bash
        run: |
          set -euo pipefail
          wheels=(dist/vuoro-client/*.whl dist/vuoro-bootstrap/*.whl dist/vuoro-service/*.whl dist/vuoro-schema-runtime/*.whl dist/vuoro-adapter-kit/*.whl)
          uv run --package vuoro-service --extra test python \
            scripts/validate_release_contract.py "${wheels[@]}" --release
          uv venv --python 3.12 /tmp/vuoro-release-conformance
          uv pip install --python /tmp/vuoro-release-conformance/bin/python \
            "${wheels[@]}" 'httpx>=0.27,<1'
          /tmp/vuoro-release-conformance/bin/python \
            scripts/validate_served_conformance.py
      - name: Select the gated wheel for publication
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          package="${{ steps.package.outputs.name }}"
          wheel_stem="${package//-/_}"
          shopt -s nullglob
          wheels=(dist/"${package}"/"${wheel_stem}"-*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "expected exactly one gated wheel for $package, found ${#wheels[@]}" >&2
            exit 1
          fi
          mkdir -p dist/publish
          wheel="dist/publish/$(basename "${wheels[0]}")"
          cp -- "${wheels[0]}" "$wheel"
          wheel_name="$(basename "$wheel")"
          sha256="$(sha256sum "$wheel" | awk '{print $1}')"
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
          echo "wheel_name=$wheel_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - name: Validate the selected gated wheel against its tag
        run: >-
          uv run --package vuoro-service --extra test python
          scripts/validate_release_contract.py
          ${{ steps.publication.outputs.wheel }}
          --tag "${GITHUB_REF_NAME}"
      - name: Attest the selected gated wheel
        uses: actions/attest@v4
        with:
          subject-path: "${{ steps.publication.outputs.wheel }}"
      - name: Create the draft GitHub release with the selected wheel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          package="${{ steps.package.outputs.name }}"
          wheel="${{ steps.publication.outputs.wheel }}"
          wheel_name="${{ steps.publication.outputs.wheel_name }}"
          sha256="${{ steps.publication.outputs.sha256 }}"
          notes=$(printf 'tag: %s\ndistribution: %s\nwheel: %s\nsha256: %s\n' \
            "$tag" "$package" "$wheel_name" "$sha256")
          gh release create "$tag" \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$tag — $package — $wheel_name — sha256:$sha256" \
            --notes "$notes" \
            "$wheel"
      - name: Publish the GitHub release after attestation and draft creation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
