name: currentness source owner conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  currentness-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: currentness-admin-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRINTCTL_TEST_PG_URL: postgresql://sprintctl_test_currentness:currentness-test-ci-only@127.0.0.1:5432/sprintctl_test_currentness
      VUORO_CURRENTNESS_OWNER_SOURCE: ${{ github.workspace }}/_owners/sprintctl
      VUORO_CURRENTNESS_OWNER_COMMIT: 8fb8224fbf75e8b7d81643a18a457cffa52f97b0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bayleafwalker/sprintctl
          ref: 8fb8224fbf75e8b7d81643a18a457cffa52f97b0
          path: _owners/sprintctl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual source service and explicit clean owner
        run: python -m pip install './packages/vuoro-service[test]' ./packages/vuoro-contracts './_owners/sprintctl[dev,remote]'
      - name: Create dedicated disposable unprivileged owner database
        env:
          PGPASSWORD: currentness-admin-ci-only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres <<'SQL'
          CREATE ROLE sprintctl_test_currentness LOGIN PASSWORD 'currentness-test-ci-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE sprintctl_test_currentness OWNER sprintctl_test_currentness;
          COMMENT ON DATABASE sprintctl_test_currentness IS 'sprintctl:disposable-integration-test';
          SQL
      - name: Actual read-only delegation HTTP and PostgreSQL fault histories
        run: >-
          python -m pytest -q packages/vuoro-service/tests/test_run_delegation.py
          packages/vuoro-service/tests/conformance/test_run_delegation_owner_pg.py::test_real_owner_currentness_read_only_scope
