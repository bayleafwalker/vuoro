name: Publish optional lane service image

on:
  push:
    tags:
      - "vuoro-service-v*"
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-lane-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Validate publication source before any registry effect
        run: |
          python3 -c 'import sys; from scripts.publish_lane_image import validate_inputs; validate_inputs(*sys.argv[1:])' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF_NAME"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            PYTHON_BASE_IMAGE=python:3.13-slim
            VUORO_COMPOSITION_FILE=packages/vuoro-service/composition/lane-adapter-pins.json
          tags: ghcr.io/${{ github.repository_owner }}/vuoro-service:lane-candidate-sha-${{ github.sha }}
      - name: Attest the candidate registry index
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/vuoro-service
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Qualify the exact digest and publish distinct lane aliases
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          python3 scripts/publish_lane_image.py \
            --repository "$GITHUB_REPOSITORY" --digest "$IMAGE_DIGEST" \
            --source-sha "$GITHUB_SHA" --ref "$GITHUB_REF_NAME" \
            --receipt lane-image-publication.json
      - name: Retain complete or partial publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-image-publication-${{ github.sha }}
          path: lane-image-publication.json
          if-no-files-found: warn
