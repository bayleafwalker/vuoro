name: Publish Vuoro service image

on:
  push:
    tags:
      - "vuoro-service-v*"
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vuoro-service:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/vuoro-service:sha-${{ github.sha }}
      - name: Generate GitHub build provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/vuoro-service
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
