name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-settlement-demo:
    # Optional consumer against released immutable owners, outside workspace/image.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - name: Install disposable PostgreSQL 16 tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: uv build --project packages/vuoro-demo --wheel --out-dir dist/vuoro-demo
      - name: Install optional wheel and qualify checkoutless native settlement
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 /tmp/vuoro-demo-conformance
          uv pip install --python /tmp/vuoro-demo-conformance/bin/python dist/vuoro-demo/*.whl 'pytest>=8,<10'
          uv pip check --python /tmp/vuoro-demo-conformance/bin/python
          VUORO_DEMO_TEST_PG_BIN=/usr/lib/postgresql/16/bin \
            /tmp/vuoro-demo-conformance/bin/python -m pytest packages/vuoro-demo/tests -q
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - run: uv run --package vuoro-client --extra test pytest packages/vuoro-client/tests
      - run: uv run --package vuoro-service --extra test pytest packages/vuoro-service/tests
      - run: uv run --package vuoro-mcp-edge --extra test pytest packages/vuoro-mcp-edge/tests
      - run: uv run --package vuoro-reconciler --extra test pytest packages/vuoro-reconciler/tests
      - run: uv run --package vuoro-knowledge --extra test pytest packages/vuoro-knowledge/tests
      - name: Validate authored knowledge metadata
        run: uv run --package vuoro-knowledge vuoro-knowledge validate --root . --errors-only
      - run: uv build --package vuoro-client --wheel --out-dir dist/vuoro-client
      - run: uv build --package vuoro-service --wheel --out-dir dist/vuoro-service
      - run: uv build --package vuoro-schema-runtime --wheel --out-dir dist/vuoro-schema-runtime
      - run: uv build --package vuoro-adapter-kit --wheel --out-dir dist/vuoro-adapter-kit
      - name: Validate built release identities
        run: >-
          uv run --package vuoro-service --extra test python
          scripts/validate_release_contract.py
          dist/vuoro-client/*.whl dist/vuoro-service/*.whl
          dist/vuoro-schema-runtime/*.whl dist/vuoro-adapter-kit/*.whl
          --release
      - name: Exercise shared wheels in an isolated Python 3.11 environment
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.11 /tmp/vuoro-shared-wheel-python311
          uv pip install --python /tmp/vuoro-shared-wheel-python311/bin/python \
            dist/vuoro-schema-runtime/*.whl dist/vuoro-adapter-kit/*.whl
          /tmp/vuoro-shared-wheel-python311/bin/python -c \
            'from vuoro_schema_runtime import migration_asset, render_schema_sql; from vuoro_adapter_kit import object_schema, operation_spec; a=migration_asset(1, "initial", "CREATE SCHEMA __SCHEMA__"); assert render_schema_sql(a.sql, "central") == '"'"'CREATE SCHEMA "central"'"'"'; s=object_schema({"value": {"type": "string"}}, required=("value",)); assert operation_spec("work.read.items", input_schema=s, result_schema=object_schema({}), execution_semantics="read", idempotency="not-allowed")["owning_domain"] == "work"'
      - name: Exercise built served contract
        shell: bash
        run: |
          uv venv --python 3.12 /tmp/vuoro-served-conformance
          uv pip install --python /tmp/vuoro-served-conformance/bin/python \
            dist/vuoro-client/*.whl dist/vuoro-service/*.whl \
            'httpx>=0.27,<1'
          /tmp/vuoro-served-conformance/bin/python \
            scripts/validate_served_conformance.py
      - run: uv run pytest
      - name: Fetch immutable adapter wheels
        run: >-
          python scripts/fetch_pinned_adapters.py
          packages/vuoro-service/composition/adapter-pins.json
          dist/adapters
      - name: Exercise pinned released work adapter
        shell: bash
        run: |
          uv venv --python 3.12 /tmp/vuoro-released-wheel
          uv pip install --python /tmp/vuoro-released-wheel/bin/python \
            dist/vuoro-service/*.whl \
            'httpx>=0.27,<1' 'click>=8.1'
          # Install the owner and its immutable shared dependency explicitly.
          # Sprintctl metadata names the same adapter-kit release; --no-deps
          # keeps this gate from resolving a different artifact.
          uv pip install --python /tmp/vuoro-released-wheel/bin/python \
            --no-deps \
            dist/adapters/vuoro_adapter_kit-*.whl \
            dist/adapters/sprintctl-*.whl
          uv pip check --python /tmp/vuoro-released-wheel/bin/python
          /tmp/vuoro-released-wheel/bin/python \
            scripts/validate_released_work_adapter.py \
            packages/vuoro-service/composition/adapter-pins.json \
            dist/adapters
      - name: Exercise pinned released audit adapter
        shell: bash
        run: |
          uv venv --python 3.12 /tmp/vuoro-released-audit-wheel
          uv pip install --python /tmp/vuoro-released-audit-wheel/bin/python \
            dist/vuoro-service/*.whl \
            'httpx>=0.27,<1'
          uv pip install --python /tmp/vuoro-released-audit-wheel/bin/python \
            --no-deps \
            dist/adapters/vuoro_adapter_kit-*.whl \
            dist/adapters/vuoro_schema_runtime-*.whl \
            dist/adapters/auditctl-*.whl
          uv pip check --python /tmp/vuoro-released-audit-wheel/bin/python
          /tmp/vuoro-released-audit-wheel/bin/python \
            scripts/validate_released_audit_adapter.py \
            packages/vuoro-service/composition/adapter-pins.json \
            dist/adapters
      - name: Exercise complete released two-domain catalog
        shell: bash
        run: |
          uv venv --python 3.12 /tmp/vuoro-released-two-domain-wheel
          uv pip install --python /tmp/vuoro-released-two-domain-wheel/bin/python \
            dist/vuoro-service/*.whl \
            'httpx>=0.27,<1' 'click>=8.1'
          uv pip install --python /tmp/vuoro-released-two-domain-wheel/bin/python \
            --no-deps \
            dist/adapters/vuoro_adapter_kit-*.whl \
            dist/adapters/vuoro_schema_runtime-*.whl \
            dist/adapters/sprintctl-*.whl \
            dist/adapters/auditctl-*.whl
          uv pip check --python /tmp/vuoro-released-two-domain-wheel/bin/python
          /tmp/vuoro-released-two-domain-wheel/bin/python \
            scripts/validate_released_catalog_composition.py
      - run: python -m json.tool vuoro.dispatch.json >/dev/null

  settlement-scenario:
    # agentops#2524 (M1-4): the differentiated settlement scenario end to
    # end -- two callers on the real MCP edge, the real runtime shell and the
    # pinned sprintctl wheel's lease on PostgreSQL; takeover, stale-result
    # rejection with evidence retained, settlement under the named profile
    # `checked`, the dependent item ready only after it, and restart/resume.
    # The edge's own tests use an in-test stand-in for the lease; this is the
    # one place the shipped owner and the shipped edge meet.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: m14
          POSTGRES_PASSWORD: m14-ci-only
          POSTGRES_DB: m14_scenario
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m14"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - name: Fetch immutable adapter wheels
        run: >-
          python scripts/fetch_pinned_adapters.py
          packages/vuoro-service/composition/adapter-pins.json
          dist/adapters
      - name: Install the pinned work owner with its PostgreSQL driver
        run: |
          uv pip install --no-deps dist/adapters/sprintctl-*.whl
          uv pip install 'psycopg[binary]>=3.1,<4'
      - name: Create an isolated lease conformance database
        env:
          PGPASSWORD: m14-ci-only
        run: createdb -h 127.0.0.1 -U m14 lease_conformance_ci
      - name: Bound proposal, evidence evaluation and attempt facts through isolated released-wheel composition
        shell: bash
        run: |
          set -euo pipefail
          uv build --package vuoro-service --wheel --out-dir dist/bound-service
          uv venv --python 3.12 /tmp/vuoro-bound-released-composition
          uv pip install --python /tmp/vuoro-bound-released-composition/bin/python \
            dist/bound-service/*.whl \
            'httpx>=0.27,<1' 'pytest>=8.3,<9' 'psycopg[binary]>=3.1,<4' 'click>=8.1'
          uv pip install --python /tmp/vuoro-bound-released-composition/bin/python \
            --no-deps dist/adapters/*.whl
          uv pip check --python /tmp/vuoro-bound-released-composition/bin/python
          VUORO_BOUND_COMPOSITION_PROOF=1 /tmp/vuoro-bound-released-composition/bin/python \
            -m pytest --import-mode=importlib \
            packages/vuoro-service/tests/conformance/test_bound_proposal_http.py \
            packages/vuoro-service/tests/conformance/test_evidence_evaluation_http.py \
            packages/vuoro-service/tests/conformance/test_effect_attempt_http.py -q \
            --lease-pg-url postgresql://m14:m14-ci-only@127.0.0.1:5432/lease_conformance_ci
      - name: Provider-neutral lease contract (reference and pinned owner)
        run: >-
          uv run --no-sync pytest packages/vuoro-service/tests/conformance -q
          --lease-pg-url postgresql://m14:m14-ci-only@127.0.0.1:5432/lease_conformance_ci
      - name: Resource carrier observations and explicit conformance gap receipts
        run: >-
          uv run --no-sync pytest packages/vuoro-service/tests/conformance/resource_owner_scenarios.py --strict-markers -q
          --lease-pg-url postgresql://m14:m14-ci-only@127.0.0.1:5432/lease_conformance_ci
      - name: Published owner accepted-discovery restart and signed-PR proof
        env:
          VUORO_EFFECT_TEST_PG_URL: postgresql://m14:m14-ci-only@127.0.0.1:5432/lease_conformance_ci
        run: uv run --no-sync pytest packages/vuoro-reconciler/tests/test_sprintctl_source_pg.py -q
      - name: Ledger, effect and provider ingestion contracts (reference and published owner)
        env:
          VUORO_AUTHORITY_TEST_PG_URL: postgresql://m14:m14-ci-only@127.0.0.1:5432/lease_conformance_ci
        run: >-
          uv run --no-sync pytest packages/vuoro-mcp-edge/tests/test_ledger_behaviour.py
          packages/vuoro-mcp-edge/tests/test_effect_authority_contract.py
          packages/vuoro-mcp-edge/tests/test_provider_ingestion_contract.py -q
      - name: Run the scenario (lease TTL 30 s)
        run: >-
          uv run --no-sync python scripts/settlement_scenario.py run
          --pg-url postgresql://m14:m14-ci-only@127.0.0.1:5432/m14_scenario
          --out _artifacts/m1-4-settlement-scenario
      - name: Actual schema-21 closure to explicit schema-22 migration
        shell: bash
        env:
          PGPASSWORD: m14-ci-only
          VUORO_BOUND_COMPOSITION_PROOF: "1"
          VUORO_SCHEMA22_COMPOSITION_PROOF: "1"
          VUORO_SCHEMA22_MIGRATION_PG_URL: postgresql://schema22_work_migration:schema22-ci-only@127.0.0.1:5432/lease_conformance_schema22_ci?options=-csearch_path%3Dwork%2Cpg_catalog
          VUORO_SCHEMA22_RUNTIME_PG_URL: postgresql://schema22_work_runtime:schema22-ci-only@127.0.0.1:5432/lease_conformance_schema22_ci?options=-csearch_path%3Dwork%2Cpg_catalog
          VUORO_SCHEMA22_AUDIT_MIGRATION_PG_URL: postgresql://schema22_audit_migration:schema22-ci-only@127.0.0.1:5432/lease_conformance_schema22_ci
          VUORO_SCHEMA22_AUDIT_RUNTIME_PG_URL: postgresql://schema22_audit_runtime:schema22-ci-only@127.0.0.1:5432/lease_conformance_schema22_ci
        run: |
          set -euo pipefail
          # Separate roles and database; no production endpoint or inherited schema.
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U m14 -d m14_scenario <<'SQL'
          CREATE ROLE schema22_work_migration LOGIN PASSWORD 'schema22-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE schema22_work_runtime LOGIN PASSWORD 'schema22-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE schema22_audit_migration LOGIN PASSWORD 'schema22-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE schema22_audit_runtime LOGIN PASSWORD 'schema22-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE lease_conformance_schema22_ci;
          GRANT CONNECT,CREATE ON DATABASE lease_conformance_schema22_ci TO schema22_work_migration,schema22_audit_migration;
          GRANT CONNECT ON DATABASE lease_conformance_schema22_ci TO schema22_work_runtime,schema22_audit_runtime;
          SQL
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U m14 -d lease_conformance_schema22_ci \
            -c 'CREATE SCHEMA work AUTHORIZATION schema22_work_migration'
          python scripts/prepare_schema21_upgrade_fixture.py /tmp/vuoro-schema21-upgrade
          /tmp/vuoro-bound-released-composition/bin/python -I scripts/attest_installed_composition.py \
            packages/vuoro-service/composition/adapter-pins.json dist/adapters /tmp/vuoro-schema22-installed.json
          export VUORO_SCHEMA21_OWNER_PYTHON=/tmp/vuoro-schema21-upgrade/venv/bin/python
          export VUORO_SCHEMA21_MANIFEST="$PWD/packages/vuoro-service/tests/fixtures/schema21-adapter-pins.json"
          export VUORO_SCHEMA21_WHEEL_DIR=/tmp/vuoro-schema21-upgrade/wheels
          export VUORO_SCHEMA21_ATTESTATION=/tmp/vuoro-schema21-upgrade/installed.json
          export VUORO_SCHEMA22_MANIFEST="$PWD/packages/vuoro-service/composition/adapter-pins.json"
          export VUORO_SCHEMA22_WHEEL_DIR="$PWD/dist/adapters"
          export VUORO_SCHEMA22_ATTESTATION=/tmp/vuoro-schema22-installed.json
          /tmp/vuoro-bound-released-composition/bin/python -m pytest --import-mode=importlib \
            packages/vuoro-service/tests/conformance/test_schema22_composition_migration.py -q
      - name: Protected effect binding on the released schema-21 owner
        env:
          PGPASSWORD: m14-ci-only
          VUORO_PROTECTED_EFFECT_TEST_PG_URL: postgresql://m14:m14-ci-only@127.0.0.1:5432/lease_conformance_protected_ci
        run: |
          # This runs after the old composition's scenarios and uses a
          # separate database. It does not change the service's runtime pin.
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from urllib.request import urlopen
          pin = json.loads(Path("packages/vuoro-reconciler/tests/fixtures/protected-work-owner.json").read_text())
          with urlopen(pin["artifact_url"]) as response:
              wheel = response.read()
          assert hashlib.sha256(wheel).hexdigest() == pin["artifact_sha256"]
          target = Path("dist/protected-owner/sprintctl-0.13.1-py3-none-any.whl")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(wheel)
          PY
          uv pip install --no-deps dist/protected-owner/sprintctl-0.13.1-py3-none-any.whl
          createdb -h 127.0.0.1 -U m14 lease_conformance_protected_ci
          uv run --no-sync pytest packages/vuoro-reconciler/tests/test_protected_source_pg.py -q
      - name: Upload the evidence packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-4-settlement-scenario
          # Only the packet: never the worker state (the gateway key is
          # generated outside this directory as well).
          path: |
            _artifacts/m1-4-settlement-scenario/transcript.*
            !_artifacts/m1-4-settlement-scenario/state/

  service-image:
    # The 0.1.76 release found the service image did not build: a workspace
    # package (vuoro-evidence) was not installed from the local tree, so pip
    # asked an index for a name nobody has registered. Build the image on
    # every PR and check what it installed, not what the build log says.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build the service image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: vuoro-service:ci
          cache-from: type=gha,scope=service-image
          cache-to: type=gha,scope=service-image,mode=max
      - name: Check installed provenance and composition attestation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t names < <(python3 scripts/validate_service_image.py workspace-names)
          docker run -i --rm --entrypoint python vuoro-service:ci \
            - check "${names[@]}" < scripts/validate_service_image.py
      - name: Check installed dependencies are consistent
        run: docker run --rm --entrypoint python vuoro-service:ci -m pip check
      - name: Check the image serves the MCP edge
        run: docker run --rm vuoro-service:ci mcp-serve --help

  mcp-strict-client:
    # The resultType/cacheScope regression reached production because
    # claude.ai is a lenient MCP client and Claude Code a strict one.  Run a
    # strict 2026-07-28 client (every response checked against the pinned
    # published schema and the value rules strict clients enforce) and the
    # D-044 two-workspace isolation test against `mcp-serve` from the
    # service image, on every PR.  A separate job from service-image so the
    # failure has its own name; it rebuilds from the same gha cache, in
    # parallel, and writes nothing back to it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v4
      - name: Build the service image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: vuoro-service:ci
          cache-from: type=gha,scope=service-image
      - name: Strict MCP 2026-07-28 client and D-044 isolation against mcp-serve
        run: scripts/mcp_strict_client.sh vuoro-service:ci
