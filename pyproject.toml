[project]
name = "vuoro-workspace"
version = "0.1.0.dev0"
description = "Development workspace for the Vuoro client and service distributions"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.uv]
package = false
# Development workspace only; the released projection wheel and Docker retain
# the immutable published client URL. Match its exact client version here.
# Wheel conformance installs use `uv pip install --no-config` so this
# override cannot replace their local wheel requirements.
override-dependencies = [
  "vuoro-client==0.1.2",
]

[tool.uv.sources]
vuoro-client = { workspace = true }

[tool.uv.workspace]
exclude = ["packages/vuoro-demo"]
members = [
  "packages/vuoro-client",
  "packages/vuoro-service",
  "packages/vuoro-schema-runtime",
  "packages/vuoro-adapter-kit",
  "packages/vuoro-evidence",
  "packages/vuoro-worker",
  "packages/vuoro-mcp-edge",
  "packages/vuoro-reconciler",
  "packages/vuoro-knowledge",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
  "packages/vuoro-client/tests",
  "packages/vuoro-service/tests",
  "packages/vuoro-schema-runtime/tests",
  "packages/vuoro-adapter-kit/tests",
  "packages/vuoro-evidence/tests",
  "packages/vuoro-worker/tests",
  "packages/vuoro-mcp-edge/tests",
  "packages/vuoro-reconciler/tests",
  "packages/vuoro-knowledge/tests",
  "tests",
]
